# Patch cert-manager ClusterIssuers to use Traefik instead of nginx.
# Applied separately after cert-manager is installed (same as base).
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
