name: Security Scan

on:
  push:
    branches:
      - main
    paths:
      - 'client/package*.json'
      - '.github/workflows/security-scan.yml'

  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:

jobs:
  frontend-security:
    name: Frontend Security Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Run npm audit
        working-directory: ./client
        run: |
          npm audit --audit-level=moderate --json > npm-audit-report.json || true
          npm audit --audit-level=moderate || true

      - name: Check for vulnerabilities
        working-directory: ./client
        run: |
          if [ ! -f npm-audit-report.json ]; then
            echo "No audit report generated"
            exit 1
          fi

          CRITICAL=$(jq -r '.metadata.vulnerabilities.critical // 0' npm-audit-report.json)
          HIGH=$(jq -r '.metadata.vulnerabilities.high // 0' npm-audit-report.json)
          MODERATE=$(jq -r '.metadata.vulnerabilities.moderate // 0' npm-audit-report.json)
          TOTAL=$(jq -r '.metadata.vulnerabilities.total // 0' npm-audit-report.json)

          echo "## Frontend Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY
          echo "| Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY

          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Critical or high severity vulnerabilities found!" >> $GITHUB_STEP_SUMMARY
            exit 1
          elif [ "$MODERATE" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Moderate severity vulnerabilities found. Review recommended." >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No moderate or higher severity vulnerabilities found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: client/npm-audit-report.json
          retention-days: 30

      - name: Check for outdated packages
        working-directory: ./client
        run: |
          npm outdated --json > npm-outdated.json || true
          OUTDATED_COUNT=$(jq 'length' npm-outdated.json 2>/dev/null || echo "0")
          if [ "$OUTDATED_COUNT" -gt 0 ]; then
            echo "Found $OUTDATED_COUNT outdated packages (informational only)"
            npm outdated || true
          else
            echo "All packages are up to date"
          fi
