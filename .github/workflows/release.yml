name: Release Verification

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to verify (e.g., 1.0.7)'
        required: true
        type: string
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            # Extract version from branch name (release/v1.0.7 -> 1.0.7)
            VERSION=$(echo "$REF_NAME" | sed 's/release\/v\?//')
          fi

          # Validate version format
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Verify version matches codebase
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          # Check package.json
          PKG_VERSION=$(grep '"version":' client/package.json | head -1 | awk -F: '{ print $2 }' | sed 's/[", ]//g')
          if [ "$PKG_VERSION" != "$EXPECTED" ]; then
            echo "Error: package.json version mismatch (found: $PKG_VERSION, expected: $EXPECTED)"
            exit 1
          fi

          # Check MODULE.bazel
          BAZEL_VERSION=$(grep 'version = "' MODULE.bazel | head -1 | sed 's/.*version = "\(.*\)".*/\1/')
          if [ "$BAZEL_VERSION" != "$EXPECTED" ]; then
            echo "Error: MODULE.bazel version mismatch (found: $BAZEL_VERSION, expected: $EXPECTED)"
            exit 1
          fi

          # Check HTML files contain the version
          for f in client/index.html client/view.html client/delete.html; do
            if ! grep -q "v${EXPECTED}" "$f"; then
              echo "Error: $f does not contain v${EXPECTED}"
              exit 1
            fi
          done

          echo "✓ All version checks passed for $EXPECTED"

      - name: Check if tag already exists
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Warning: Tag $TAG already exists"
          else
            echo "Tag $TAG does not exist yet (will be created by release script after merge)"
          fi
