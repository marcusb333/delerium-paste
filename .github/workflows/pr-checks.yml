name: CI

on:
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-cache
        with:
          path: client/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('client/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: client/.eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('client/src/**/*.ts', 'client/eslint.config.mjs') }}
          restore-keys: ${{ runner.os }}-eslint-

      - name: Install dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npx eslint "src/**/*.ts" --cache --cache-location .eslintcache

      - name: Type check
        working-directory: client
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: client
        run: npx jest --testPathIgnorePatterns=/integration/ --testPathIgnorePatterns=/e2e/ --coverage

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', '**/*.bzl', 'server/BUILD.bazel') }}
          restore-keys: ${{ runner.os }}-bazel-

      - name: Install Bazelisk
        run: |
          ARCH=$(uname -m)
          case $ARCH in
            x86_64) BAZELISK_ARCH="amd64" ;;
            aarch64|arm64) BAZELISK_ARCH="arm64" ;;
            *) echo "Unsupported arch: $ARCH"; exit 1 ;;
          esac
          curl -LO "https://github.com/bazelbuild/bazelisk/releases/download/v1.28.1/bazelisk-linux-${BAZELISK_ARCH}"
          chmod +x "bazelisk-linux-${BAZELISK_ARCH}"
          sudo mv "bazelisk-linux-${BAZELISK_ARCH}" /usr/local/bin/bazel

      - name: Build and test
        run: |
          bazel build //server:delerium_server_deploy
          bazel test //server:all_tests --test_output=errors

  summary:
    name: Summary
    runs-on: ubuntu-24.04
    needs: [frontend, backend]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.backend.result }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.backend.result }}" != "success" ]; then
            exit 1
          fi
