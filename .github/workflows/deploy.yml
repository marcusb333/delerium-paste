name: Build and Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build-amd64:
    name: Build AMD64
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.extract-tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract tag
        id: extract-tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/marcusb333/delerium-paste:${{ steps.extract-tag.outputs.tag }}-amd64
            marcusb333/delerium-server:${{ steps.extract-tag.outputs.tag }}-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=min,scope=amd64

  build-arm64:
    name: Build ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/marcusb333/delerium-paste:${{ github.ref_name }}-arm64
            marcusb333/delerium-server:${{ github.ref_name }}-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=min,scope=arm64

  merge:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-24.04
    needs: [build-amd64, build-arm64]

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - uses: docker/setup-buildx-action@v3

      - name: Create and push GHCR multi-arch manifest
        env:
          TAG: ${{ needs.build-amd64.outputs.tag }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/marcusb333/delerium-paste:${TAG} \
            -t ghcr.io/marcusb333/delerium-paste:latest \
            ghcr.io/marcusb333/delerium-paste:${TAG}-amd64 \
            ghcr.io/marcusb333/delerium-paste:${TAG}-arm64

      - name: Create and push Docker Hub multi-arch manifest
        env:
          TAG: ${{ needs.build-amd64.outputs.tag }}
        run: |
          docker buildx imagetools create \
            -t marcusb333/delerium-server:${TAG} \
            -t marcusb333/delerium-server:latest \
            marcusb333/delerium-server:${TAG}-amd64 \
            marcusb333/delerium-server:${TAG}-arm64

  deploy:
    name: Trigger VPS Deploy
    runs-on: ubuntu-24.04
    needs: [merge]

    steps:
      - name: Call deploy webhook
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          curl -f -X POST "https://${VPS_HOST}/hooks/deploy" \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\": \"${TAG}\"}"
