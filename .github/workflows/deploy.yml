name: Build and Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.extract-tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract tag
        id: extract-tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/marcusb333/delerium-paste:${{ steps.extract-tag.outputs.tag }}
            ghcr.io/marcusb333/delerium-paste:latest
            marcusb333/delerium-server:${{ steps.extract-tag.outputs.tag }}
            marcusb333/delerium-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger VPS Deploy
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Call deploy webhook
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          curl -f -X POST "https://${VPS_HOST}/hooks/deploy" \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag\": \"${TAG}\"}"
