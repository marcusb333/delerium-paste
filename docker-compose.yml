services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: delerium
      POSTGRES_USER: delerium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delerium}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delerium -d delerium"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        reservations:
          memory: 128M
    networks:
      - app-network

  server:
    image: marcusb333/delerium-server:v1.7.3
    build:
      context: .
      dockerfile: ./server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # For cloud deployments, use provider secret management
      # (e.g. defang config set DELETION_TOKEN_PEPPER)
      - DELETION_TOKEN_PEPPER=${DELETION_TOKEN_PEPPER}
      - DB_PATH=jdbc:postgresql://postgres:5432/delerium
      - DB_USER=delerium
      - DB_PASSWORD=${POSTGRES_PASSWORD:-delerium}
      - DATA_ENC_KEYRING_PATH=/app/keyring.json
      - DATA_ENC_ROTATION_DAYS=30
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        reservations:
          memory: 256M
    networks:
      - app-network

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./reverse-proxy/nginx-local-https.conf:/etc/nginx/nginx.conf:ro
      - ./ssl/local:/etc/nginx/ssl:ro
      - ./client:/usr/share/nginx/html:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
