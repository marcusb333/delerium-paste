<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self';">
    <title>Delete Paste - Delirium</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles/design-system.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/pages.css">
    <link rel="stylesheet" href="styles/mobile.css">
  </head>
  <body>
    <div class="container" style="max-width: 600px;">
      <header class="header" role="banner">
        <h1 class="logo">Delete Paste</h1>
      </header>

      <main class="card" id="content" role="main">
        <div class="message info">
          <p class="delete-warning">Confirm Deletion</p>
          <p>Are you sure you want to permanently delete this paste?</p>
          <p>This action cannot be undone.</p>
        </div>
        <div style="display: flex; gap: var(--space-3); margin-top: var(--space-4);">
          <button class="btn btn-danger" id="confirmDelete">Yes, Delete Paste</button>
          <button class="btn btn-secondary" onclick="window.close()">Cancel</button>
        </div>
      </main>

      <footer class="footer" role="contentinfo">
        <p>Delirium Paste</p>
      </footer>
    </div>

    <!-- Version Display -->
    <a href="https://github.com/SnarkyB/delerium-paste" target="_blank" rel="noopener noreferrer" class="version-display">v1.7.3</a>

    <script src="js/delete.js"></script>
  </body>
</html>
