volumes:
  pgdata:
    driver: local

networks:
  app-network:
    driver: bridge

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: delerium
      POSTGRES_USER: delerium
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delerium -d delerium"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  server:
    image: marcusb333/delerium-server:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_PATH=jdbc:postgresql://postgres:5432/delerium
      - DB_USER=delerium
      - DATA_ENC_KEYRING_PATH=/app/keyring.json
      - DATA_ENC_ROTATION_DAYS=30
    ports:
      - "80:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
