# Development overrides for docker-compose.yml
# This file extends the base configuration for development

volumes:
  pgdata:
    driver: local

services:
  postgres:
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    # Expose port for direct access during development
    ports:
      - "8080:8080"
    # Mount only the files the browser needs (not node_modules/src/tests)
    volumes:
      - ./client/js:/app/static/js:ro
      - ./client/styles:/app/static/styles:ro
      - ./client/vendor:/app/static/vendor:ro
      - ./client/index.html:/app/static/index.html:ro
      - ./client/view.html:/app/static/view.html:ro
      - ./client/delete.html:/app/static/delete.html:ro
      - ./client/favicon.svg:/app/static/favicon.svg:ro
    # Add development environment variables
    environment:
      - DELETION_TOKEN_PEPPER=dev-pepper-change-me
      - STATIC_DIR=/app/static
      - LOG_LEVEL=DEBUG
    # Health check with shorter intervals for faster feedback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Docker watch configuration for server
    develop:
      watch:
        - action: rebuild
          path: ./server/src
        - action: rebuild
          path: ./server/BUILD.bazel
        - action: rebuild
          path: ./server/Dockerfile
        - action: sync+restart
          path: ./client/js
          target: /app/static/js
        - action: sync+restart
          path: ./client/styles
          target: /app/static/styles
        - action: sync+restart
          path: ./client/index.html
          target: /app/static/index.html
        - action: sync+restart
          path: ./client/view.html
          target: /app/static/view.html
        - action: sync+restart
          path: ./client/delete.html
          target: /app/static/delete.html
        - action: sync+restart
          path: ./client/favicon.svg
          target: /app/static/favicon.svg
        - action: sync+restart
          path: ./client/vendor
          target: /app/static/vendor
