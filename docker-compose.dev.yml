# Development overrides for docker-compose.yml
# This file extends the base configuration for development

volumes:
  pgdata:
    driver: local

services:
  postgres:
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    # Expose port for direct access during development
    ports:
      - "8081:8080"
    # Add development environment variables
    environment:
      - DELETION_TOKEN_PEPPER=dev-pepper-change-me
      - LOG_LEVEL=DEBUG
    # Health check with shorter intervals for faster feedback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Docker watch configuration for server
    # Note: Server rebuilds are triggered but may take 30-60s due to Bazel compilation
    develop:
      watch:
        - action: rebuild
          path: ./server/src
        - action: rebuild
          path: ./server/BUILD.bazel
        - action: rebuild
          path: ./server/Dockerfile

  web:
    # Override port for local dev (avoid requiring root for port 80)
    ports:
      - "8080:80"
    # Mount local files for live editing
    volumes:
      - ./client:/usr/share/nginx/html:ro
      - ./reverse-proxy/nginx-dev.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    # Docker watch configuration for client files
    develop:
      watch:
        - action: sync+restart
          path: ./client/js
          target: /usr/share/nginx/html/js
        - action: sync+restart
          path: ./client/styles
          target: /usr/share/nginx/html/styles
        - action: sync+restart
          path: ./client/index.html
          target: /usr/share/nginx/html/index.html
        - action: sync+restart
          path: ./client/view.html
          target: /usr/share/nginx/html/view.html
        - action: sync+restart
          path: ./client/delete.html
          target: /usr/share/nginx/html/delete.html
        - action: sync+restart
          path: ./client/favicon.svg
          target: /usr/share/nginx/html/favicon.svg
        - action: sync+restart
          path: ./client/vendor
          target: /usr/share/nginx/html/vendor
