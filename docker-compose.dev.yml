# Development overrides for docker-compose.yml
# This file extends the base configuration for development

volumes:
  pgdata:
    driver: local

services:
  postgres:
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    # Add development environment variables
    environment:
      - DELETION_TOKEN_PEPPER=dev-pepper-change-me
      - LOG_LEVEL=DEBUG
    # Health check with shorter intervals for faster feedback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Docker watch: rebuild server on source changes
    develop:
      watch:
        - action: rebuild
          path: ./server/src
        - action: rebuild
          path: ./server/BUILD.bazel
        - action: rebuild
          path: ./server/Dockerfile

  web:
    # Static files served directly from the client build directory
    volumes:
      - ./reverse-proxy/nginx-local-https.conf:/etc/nginx/nginx.conf:ro
      - ./ssl/local:/etc/nginx/ssl:ro
      - ./client:/usr/share/nginx/html:ro
    # Docker watch: sync client file changes into nginx without restart
    develop:
      watch:
        - action: sync
          path: ./client/js
          target: /usr/share/nginx/html/js
        - action: sync
          path: ./client/styles
          target: /usr/share/nginx/html/styles
        - action: sync
          path: ./client/index.html
          target: /usr/share/nginx/html/index.html
        - action: sync
          path: ./client/view.html
          target: /usr/share/nginx/html/view.html
        - action: sync
          path: ./client/delete.html
          target: /usr/share/nginx/html/delete.html
        - action: sync
          path: ./client/favicon.svg
          target: /usr/share/nginx/html/favicon.svg
        - action: sync
          path: ./client/vendor
          target: /usr/share/nginx/html/vendor
