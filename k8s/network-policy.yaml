# NetworkPolicy: lock down pod-to-pod traffic in the delerium namespace.
#
# Topology enforced:
#   ingress-controller → server:8080
#   server             → postgres:5432
#
# Requires a CNI that supports NetworkPolicy (Calico, Cilium, Weave, etc.).

---
# Allow the ingress controller to reach the server pod on port 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: delerium-server-ingress
  namespace: delerium
spec:
  podSelector:
    matchLabels:
      app: delerium-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
