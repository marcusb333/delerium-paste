apiVersion: v1
kind: ConfigMap
metadata:
  name: delerium-web-nginx-conf
  namespace: delerium
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;

    error_log  /var/log/nginx/error.log notice;
    pid        /tmp/nginx.pid;

    events {
      worker_connections  1024;
    }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;

      log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

      access_log  /var/log/nginx/access.log  main;

      sendfile         on;
      keepalive_timeout  65;
      server_tokens    off;

      # Temp paths — required for read-only root filesystem
      client_body_temp_path  /tmp/nginx-client-body;
      proxy_temp_path        /tmp/nginx-proxy;
      fastcgi_temp_path      /tmp/nginx-fastcgi;
      uwsgi_temp_path        /tmp/nginx-uwsgi;
      scgi_temp_path         /tmp/nginx-scgi;

      # Rate limiting: 10 req/min per IP on API endpoints
      limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;

      server {
        listen 80 default_server;
        server_name _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Security headers (TLS headers are also set here for defence-in-depth;
        # the Ingress controller terminates TLS and adds HSTS at the edge too)
        add_header Strict-Transport-Security   "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options             "DENY"      always;
        add_header X-Content-Type-Options      "nosniff"   always;
        add_header X-XSS-Protection            "1; mode=block" always;
        add_header Referrer-Policy             "no-referrer" always;
        add_header Permissions-Policy          "accelerometer=(), geolocation=(), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy     "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; media-src 'none'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self';" always;

        # Static assets — SPA fallback
        location / {
          try_files $uri $uri/ /index.html;
          add_header Cross-Origin-Opener-Policy   "same-origin" always;
          add_header Cross-Origin-Resource-Policy "same-origin" always;
        }

        # Compiled JS — long-term immutable cache
        location ~* \.js$ {
          try_files $uri =404;
          add_header Cross-Origin-Opener-Policy   "same-origin" always;
          add_header Cross-Origin-Resource-Policy "same-origin" always;
          add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # CSS — long-term immutable cache
        location ~* \.css$ {
          try_files $uri =404;
          add_header Cross-Origin-Opener-Policy   "same-origin" always;
          add_header Cross-Origin-Resource-Policy "same-origin" always;
          add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # API proxy → Kotlin/Ktor backend service
        location /api/ {
          limit_req zone=api_limit burst=5 nodelay;

          proxy_pass         http://delerium-server:8080/api/;
          proxy_http_version 1.1;
          proxy_set_header   Host               $host;
          proxy_set_header   X-Real-IP          $remote_addr;
          proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto  $scheme;

          proxy_connect_timeout 60s;
          proxy_send_timeout    60s;
          proxy_read_timeout    60s;
        }

        location = /view.html   { try_files $uri =404; }
        location = /delete.html { try_files $uri =404; }
      }
    }
