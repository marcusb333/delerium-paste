apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: delerium-server-data
  namespace: delerium
  labels:
    app: delerium-server
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName: ""  # Uncomment and set if your cluster has a specific storage class
