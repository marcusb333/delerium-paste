# PodDisruptionBudget — ensures the server pod survives voluntary disruptions
# (node drains, cluster upgrades) without downtime.
#
# The server runs at replicas: 1, so maxUnavailable: 1 is used rather than
# minAvailable: 1.  minAvailable: 1 with replicas: 1 would block all drains.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: delerium-server-pdb
  namespace: delerium
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: delerium-server
