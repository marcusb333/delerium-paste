apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - server/secret.yaml
  - server/pvc.yaml
  - server/deployment.yaml
  - server/service.yaml
  - web/configmap.yaml
  - web/deployment.yaml
  - web/service.yaml
  - network-policy.yaml
  - pdb.yaml
  - ingress.yaml
  # cert-manager/cluster-issuer.yaml is applied separately after cert-manager is installed
