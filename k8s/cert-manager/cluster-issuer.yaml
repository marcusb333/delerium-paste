# cert-manager ClusterIssuers for Let's Encrypt.
#
# Pre-requisites:
#   1. cert-manager installed in the cluster:
#      kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#      kubectl wait --namespace cert-manager --for=condition=Ready pod --all --timeout=120s
#
#   2. Replace REPLACE_WITH_YOUR_EMAIL in both issuers below.
#
# Apply this file AFTER cert-manager is ready:
#   kubectl apply -f k8s/cert-manager/cluster-issuer.yaml
#
# Workflow:
#   - Use letsencrypt-staging first to verify your setup (no rate limits).
#     Set cert-manager.io/cluster-issuer: "letsencrypt-staging" in the Ingress,
#     accept the untrusted cert, then switch to letsencrypt-prod.

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: REPLACE_WITH_YOUR_EMAIL
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: REPLACE_WITH_YOUR_EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
