volumes:
  pgdata:
    driver: local

services:
  postgres:
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    image: marcusb333/delerium-server:v1.4.6
    build:
      context: .
      dockerfile: ./server/Dockerfile
    restart: unless-stopped
    environment:
      - DELETION_TOKEN_PEPPER=${DELETION_TOKEN_PEPPER}
      - DB_PATH=jdbc:postgresql://postgres:5432/delerium
      - DB_USER=delerium
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DATA_ENC_KEYRING_PATH=/app/keyring.json
      - DATA_ENC_ROTATION_DAYS=30
    ports:
      - "80:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
